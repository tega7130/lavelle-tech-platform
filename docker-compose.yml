services:
  postgres:
    image: postgres:16-alpine
    container_name: lavelle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavelle
      POSTGRES_PASSWORD: lavelle
      POSTGRES_DB: lavelle
    ports:
      - "5432:5432"
    volumes:
      - lavelle-postgres-data:/var/lib/postgresql/data

volumes:
  lavelle-postgres-data:
